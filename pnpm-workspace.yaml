auditConfig:
  ignoreGhsas:
    # graphql-modules (2.x and 3.x alike) pins the @graphql-tools 10.x chain, so no
    # upgrade can clear GHSA-7mx3-vvmw-hjmv (mergeDeep prototype pollution). its
    # attack path is merging subgraph responses in a federation gateway, which this
    # app's single local schema never does.
    - GHSA-7mx3-vvmw-hjmv
